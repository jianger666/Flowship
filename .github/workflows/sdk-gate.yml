name: sdk-gate

# @cursor/sdk 变更（或改了依赖它的读写格式 / 读取语义的本地 store、GC、会话轮换代码）时，自动重跑对拍测试。
# 这些测试都拿 SDK 原实现当标准答案（原实现写、我们读；我们写、原实现读），
# SDK 升级后文件格式或读取语义一变，这里先红；红灯阻塞合入。
#
# 2026-10-09：原先这里还有 worker 契约测试 / 故障注入 / experiment-b 三步，
# 随 worker 隔离整体删除（experiment-b 只是打印版本的占位脚本，从未真正断言过什么）。

on:
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/lib/server/agent-backend.ts"
      # 本地 checkpoint store（FastCheckpoints）/ GC / 会话轮换：改它们必须重跑对应契约测试。
      # 测试文件也算触发条件，否则「悄悄改弱断言」不会被门禁发现。
      - "src/lib/server/fast-checkpoint-store.ts"
      - "src/lib/server/sdk-agent-store.ts"
      - "src/lib/server/sdk-store-gc.ts"
      - "src/lib/server/session-rotate.ts"
      - "tests/fast-checkpoint-*.test.ts"
      - "tests/helpers/fast-store-helpers.ts"
      - "tests/sdk-agent-store*.test.ts"
      - "tests/sdk-store-gc*.test.ts"
      - "tests/session-rotate*.test.ts"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/lib/server/agent-backend.ts"
      # 同 push 段：本地 checkpoint store / GC / 会话轮换
      - "src/lib/server/fast-checkpoint-store.ts"
      - "src/lib/server/sdk-agent-store.ts"
      - "src/lib/server/sdk-store-gc.ts"
      - "src/lib/server/session-rotate.ts"
      - "tests/fast-checkpoint-*.test.ts"
      - "tests/helpers/fast-store-helpers.ts"
      - "tests/sdk-agent-store*.test.ts"
      - "tests/sdk-store-gc*.test.ts"
      - "tests/session-rotate*.test.ts"

jobs:
  sdk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只在 Linux 跑；Windows 语义靠测试里的故障注入模拟，真机行为需要三平台 CI 另行验证。
      - name: checkpoint store / GC / 会话轮换测试
        run: pnpm vitest run tests/fast-checkpoint-store.test.ts tests/fast-checkpoint-agent-ops.test.ts tests/sdk-agent-store-wiring.test.ts tests/sdk-agent-store.test.ts tests/sdk-store-gc.test.ts tests/sdk-store-gc-store-path.test.ts tests/sdk-store-gc-heal.test.ts tests/session-rotate.test.ts tests/session-rotate-chat.test.ts tests/session-rotate-midrun.test.ts
