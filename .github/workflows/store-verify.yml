name: store-verify

# 临时验证分支专用（ci/store-verify-*）：在 Linux / macOS / Windows 三平台跑
# 「checkpoint store 提速 + GC 走公共 API + token 水位默认关」相关测试。
# 目的：补上本机无法覆盖的真实 NTFS / Defender / CRLF 验证（release.yml 里的
# Windows runner 只打包、不跑测试）。不进主线，验证完整个分支可丢弃。
#
# 结果统一用 ::notice / ::error 注解输出（匿名可在 job 页直接看到，不依赖需要登录的日志）。

on:
  push:
    branches: ["ci/store-verify-**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 package.json 的 packageManager 字段读（与 release.yml 一致）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 环境信息
        run: |
          echo "os=${{ runner.os }} arch=${{ runner.arch }}"
          node -v
          pnpm -v
          git --version
          git config --get core.autocrlf || echo "core.autocrlf=(unset)"

      # 本次改动直接相关的测试：三平台都必须全绿
      - name: 相关测试（三平台）
        run: >-
          pnpm exec vitest run --reporter=verbose --reporter=json --outputFile.json=vitest-related.json
          tests/fast-checkpoint-store.test.ts
          tests/sdk-agent-store-wiring.test.ts
          tests/sdk-store-gc-store-path.test.ts
          tests/sdk-store-gc.test.ts
          tests/sdk-agent-store.test.ts
          tests/session-rotate.test.ts
          tests/session-rotate-chat.test.ts
          tests/session-rotate-midrun.test.ts

      - name: 相关测试汇总（注解）
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("vitest-related.json")) {
              console.log("::error title=相关测试汇总 ${{ runner.os }}::没有生成 JSON 结果（vitest 未正常结束）");
              process.exit(0);
            }
            const r = JSON.parse(fs.readFileSync("vitest-related.json", "utf8"));
            const per = r.testResults.map(f => f.name.split(/[\\/]/).pop() + "=" + f.assertionResults.filter(t => t.status === "passed").length + "/" + f.assertionResults.length).join("  ");
            console.log("::notice title=相关测试汇总 ${{ runner.os }}::文件 " + r.testResults.length + " 个，用例 " + r.numTotalTests + "，通过 " + r.numPassedTests + "，失败 " + r.numFailedTests + "，跳过 " + r.numPendingTests + "；明细 " + per);
            const esc = s => s.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            const noAnsi = s => String(s).replace(/\u001b\[[0-9;]*m/g, "");
            for (const f of r.testResults) {
              for (const t of f.assertionResults) {
                if (t.status !== "failed") continue;
                const msg = noAnsi((t.failureMessages || []).join("\n---\n")).slice(0, 1600);
                console.log("::error title=失败用例 ${{ runner.os }}::" + esc(f.name.split(/[\\/]/).pop() + " :: " + t.fullName + "\n" + msg));
              }
            }
          '

      # 偶发失败复现：同一批最可疑的测试，重复 + 并行（制造 CPU / 磁盘争抢）多跑几轮。
      # 背景：上一轮 Windows 曾有 1 个用例失败、下一轮同样代码又全绿——要分清是测试时序不稳还是实现缺陷。
      # A 组：默认 5s 超时（与日常门禁一致）；B 组：放宽到 60s，把「纯慢」和「真失败」分开看。
      - name: 压力复现（重复 + 并行；A 组默认超时、B 组 60s）
        if: always()
        run: |
          mkdir -p stress-out
          FILES="tests/sdk-store-gc-store-path.test.ts tests/fast-checkpoint-store.test.ts tests/sdk-store-gc.test.ts tests/sdk-agent-store-wiring.test.ts"
          for round in 1 2 3 4 5; do
            for k in 1 2 3; do
              ( pnpm exec vitest run --reporter=json --outputFile.json=stress-out/r-a-$round-$k.json $FILES > stress-out/log-a-$round-$k.txt 2>&1 || true ) &
            done
            wait
          done
          for round in 1 2 3; do
            for k in 1 2 3; do
              ( pnpm exec vitest run --testTimeout=60000 --reporter=json --outputFile.json=stress-out/r-b-$round-$k.json $FILES > stress-out/log-b-$round-$k.txt 2>&1 || true ) &
            done
            wait
          done

      - name: 压力复现汇总（注解）
        if: always()
        run: node .github/scripts/stress-summary.cjs stress-out

      - name: 类型检查（仅 Linux）
        if: runner.os == 'Linux'
        run: pnpm typecheck

  # Linux 全量：本次分支 vs main 基线，同环境对照，判断失败是「老问题」还是「本次引入」
  full-linux:
    name: full (ubuntu, ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 本次分支
            ref: ""
          - label: main 基线
            ref: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 全量 vitest（${{ matrix.label }}）
        continue-on-error: true
        run: pnpm exec vitest run --reporter=json --outputFile.json=vitest-full.json

      - name: 全量结果汇总（注解）
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("vitest-full.json")) {
              console.log("::error title=全量汇总 ${{ matrix.label }}::没有生成 JSON 结果");
              process.exit(0);
            }
            const r = JSON.parse(fs.readFileSync("vitest-full.json", "utf8"));
            const cwd = process.cwd() + "/";
            const bad = [];
            for (const f of r.testResults) {
              const fails = f.assertionResults.filter(t => t.status === "failed");
              for (const t of fails) bad.push(f.name.replace(cwd, "") + " :: " + t.fullName);
              if (f.status === "failed" && !fails.length) bad.push(f.name.replace(cwd, "") + " :: (文件级失败) " + String(f.message || "").split("\n")[0].slice(0, 160));
            }
            const esc = s => s.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            console.log("::notice title=全量汇总 ${{ matrix.label }}::文件 " + r.testResults.length + "，用例 " + r.numTotalTests + "，通过 " + r.numPassedTests + "，失败 " + r.numFailedTests + "，跳过 " + r.numPendingTests);
            if (bad.length) console.log("::error title=失败清单 ${{ matrix.label }}（" + bad.length + " 项）::" + esc(bad.join("\n")));
          '
