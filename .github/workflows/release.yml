# 发版流水线：push 一个 v* tag → 自动 build → 传 GitHub Release
# 唯一交付物 = Electron 安装包：win nsis（exe + latest.yml、electron-updater 自动更新）
#   + mac arm64 dmg + mac x64 dmg（Intel、v1.1.5 起）
# 流程：verify 门禁（ci.yml：typecheck + eslint + vitest、不过不往下走）→
#       ubuntu job build standalone server（纯 JS 跨平台、一份给 win/mac 复用）+ 建 release 占位；
#       win/mac matrix job 各自打安装包、electron-builder --publish 追加 asset 到同 release；
#       finalize 汇总两枚 mac dmg + win exe 签 update-manifest（壳下载后验签、win / mac 同一套）再转正 draft
name: release

on:
  push:
    # 只认严格的 vX.Y.Z（GitHub tag 过滤器要求整串匹配）：`v*` 会放过 `vfoo` / `v1.2.3-rc.1` 这类
    # 不是正式版本号的 tag——它们一样会触发整条流水线、走到签名与转正。仓库全部历史 tag 都是 vX.Y.Z。
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  # 发版前置闸：tag 必须是 vX.Y.Z（防过滤器被改松）、且它指向的提交已经在 main 上。
  # 签名私钥只受「能推 tag」保护——任何有写权限的人在别的分支提交上打个 tag，就能让流水线拿私钥给任意包签名；
  # 要求提交在 main 的祖先链上，就把「谁能发版」收窄成「谁能把提交合进 main」。
  # 在 verify 之前跑：不过就什么都不做（不 build、不建 draft、不碰私钥）。
  # 用法提示：先 push main、再 push tag（或同一条 `git push origin main <tag>`）；tag 先到、main 还没到会在这里红，补推 main 后重跑即可。
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0：要完整历史才能判断祖先关系
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: tag 格式 + 提交在 main 上
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag「$GITHUB_REF_NAME」不是 vX.Y.Z、拒绝发版"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::tag「$GITHUB_REF_NAME」指向的提交 $GITHUB_SHA 不在 origin/main 上、拒绝发版（先把提交合进 main 再打 tag）"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME → $GITHUB_SHA 在 main 上、放行"

  # 发版门禁（typecheck + eslint + 全量 vitest，定义在 ci.yml、与 PR / 手动触发共用一份）。
  # 不过就不往下走：不 build、不建 draft release、不出包——tag 已 push 也不会产生半成品 release，
  # 修好后删 tag 重打即可。
  verify:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 package.json 的 packageManager 字段读、不在这双写
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # node-linker=hoisted：node_modules 平铺实体（npm 风格、无 pnpm symlink 拓扑）、
      # standalone trace 产物随之全实体——tar / nsis 跨 Windows 不再有 symlink
      # 兼容雷（pnpm isolated 布局的相对链接在 win 解压器上是死链）
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - run: pnpm build
        env:
          BUILD_STANDALONE: "1"

      # 组 electron job 复用的 server 布局。
      # standalone 纯 JS 跨平台、ubuntu build 一份 win/mac 都用；且 win runner 上
      # next build 会撞 EPERM scandir "Application Data" junction、必须绕开
      - run: node scripts/assemble-electron-server.mjs

      # 发版冒烟：把组好的 server 真启动一次（readyz → 首页 200 → 静态资源 200）。
      # 此前整条发版链没有任何一步真跑过打出来的 server，而 finalize 会自动把 draft 转正——
      # 「单测 / build 全绿、装上才发现 server 起不来」（缺依赖 / 漏拷 .next/static）只能靠用户踩。
      # 放在建 release 占位之前：冒烟红了不会留下一个半成品 draft。
      # 只覆盖 Linux 上的 server 布局；win / mac 平台包（@cursor/sdk-<platform>）由 electron job 里的实加载验真兜底。
      - name: 冒烟：server 布局真启动一次
        run: node scripts/smoke-boot-server.mjs --server-dir dist/app-server

      # 先建 release 占位（generate_release_notes）——让下游 win/mac electron job 的
      # electron-builder --publish 往同 tag release 追加 asset、不竞态创建。
      # 关键：建成 draft（不可见）——electron-builder getOrCreateRelease 会优先复用匹配
      # tag 的 draft（源码 if(release.draft) return release）、asset 全传完再由 finalize
      # 转正 published。draft 期间 /releases/latest 不指向它、自更新查不到 → 杜绝
      # 「用户在 dmg/yml 传完前就查到新版、下到残缺包」（v0.8.0 mac 自更新踩过、ditto 拷残缺炸）。
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true

      # tar 保留权限 / 防 artifact zip 丢元数据
      - run: tar -czf app-server.tar.gz -C dist app-server

      - uses: actions/upload-artifact@v4
        with:
          name: app-server
          path: app-server.tar.gz
          retention-days: 1

  # Electron 安装包（win + mac arm64 + mac x64 同构、矩阵跑）。
  # needs build-release：复用它 build 的 server 布局；也让它先建好 release 占位、
  # electron-builder 往同 tag release 追加 asset（exe / dmg / latest.yml）不竞态
  electron:
    needs: build-release
    # environment：mac 两个架构用受保护的 `release`（里面放代码签名私钥 FLOWSHIP_SIGN_P12_*；
    # 配了 Required reviewers 就要审批才放行）；win 用单独的 `release-win`（无 secret、无保护，
    # GitHub 按名字首次引用时自动建）。不让 win 也进 `release`：environment 级 secret 对引用它的 job 全部可见，
    # win job 没理由碰签名私钥。也不写成「win 项留空」：文档没说空值怎么处理，宁可用确定的行为。
    # 注意：release 配了 Required reviewers 时，mac 两个架构各要审批一次（加上 finalize 共 3 次），
    # 矩阵又是串行（max-parallel: 1），审批前后面的 job 会排队等。
    environment: ${{ matrix.environment }}
    strategy:
      # mac 现在要走签名证书、缺 secret 会红——失败不连坐 win
      fail-fast: false
      # 串行：win / mac 各自往同一个 draft release overwrite asset、并发会撞出
      # 0 字节的 latest.yml（v0.8.0 踩过、win electron-updater 全靠它、空了 win 自更新挂）——
      # 串行彻底避免 release asset 列表的并发 race
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --win
            sdk_platform: win32-x64
            environment: release-win
          # arch 由 CLI flag 决定（electron-builder.yml 的 mac.target 不再写死 arch）
          - os: macos-latest
            args: --mac --arm64
            sdk_platform: darwin-arm64
            environment: release
          # arm64 runner 上交叉打 x64 是 electron-builder 官方支持的、Electron 二进制按 arch 下载
          - os: macos-latest
            args: --mac --x64
            sdk_platform: darwin-x64
            environment: release
    runs-on: ${{ matrix.os }}
    env:
      # 自签证书的 SHA-1 指纹（公开信息、不是密钥）。「导入 mac 签名证书」步骤用它做签名探针，
      # electron-builder 步骤里 afterPack 用它签名并核对产物的签名身份；换证书只改这一处（win 不读）。
      FLOWSHIP_SIGN_IDENTITY: "566f6cac5a06f6cca21f6cb23039e370a007137d"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 只为装 electron + electron-builder（devDeps）、不在本机 build Next
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: app-server

      - run: mkdir -p dist && tar -xzf app-server.tar.gz -C dist
        shell: bash

      # 修平台依赖（v0.7.6 引入、V0.11.5 改 npm pack 精准落包）：server 布局是 ubuntu 组的——
      # SDK 平台工具包（@cursor/sdk-<platform>、含 ripgrep / 沙箱 helper）是运行时
      # 动态拼名加载、构建追踪追不到、整包缺失；在目标平台 runner 下载对应平台包解进 node_modules。
      # ⚠️ 不能用 `npm install <pkg>`（v0.7.6~v0.11.4 踩的大坑）：dist/app-server 的 package.json
      # 是全项目的、npm install 装单包时会顺手把「缺失」的全部 dependencies 重装成**完整包**
      # （full next + @next/swc 平台二进制 + lucide 等、app-server 85M → 532M）、
      # 安装包被撑到 190-215MB、Windows 安装要多落盘 ~500MB——这就是「装得慢、包太大」的主根因。
      # `npm pack` 只取平台包 tarball 本体、零依赖解析。
      # 注：sqlite3 早已不是项目依赖（v0.8.11 清理死配置）——standalone 里根本没有它，
      # 旧脚本还在探测 `sqlite3/package.json` 版本直接炸（v0.8.7~v0.8.10 打包全挂的根因）。
      - run: |
          # 版本读已装包的真实版本（不带 ^、跟 ubuntu 解析结果钉死一致）
          SDK_VERSION=$(node -p "require('./node_modules/@cursor/sdk/package.json').version")
          PKG="@cursor/sdk-${{ matrix.sdk_platform }}"
          npm pack "${PKG}@${SDK_VERSION}"
          mkdir -p "node_modules/${PKG}"
          tar -xzf "cursor-sdk-${{ matrix.sdk_platform }}-${SDK_VERSION}.tgz" -C "node_modules/${PKG}" --strip-components=1
          rm "cursor-sdk-${{ matrix.sdk_platform }}-${SDK_VERSION}.tgz"
          # 实加载验真：平台包缺失 / 版本不符在这里当场炸、不带病发版
          node -p "require('${PKG}/package.json').version + ' platform pkg ok'"
        shell: bash
        working-directory: dist/app-server

      # 壳的 runtime 依赖（electron-updater + koffi）、装进 electron-app/node_modules 进 asar。
      # 必须用 pnpm（跟根项目一致）：electron-builder 按根 lockfile 判定 pm=pnpm、
      # npm 风格的 node_modules 收集不到、会 fallback 把主项目全家桶打进 asar（271M 事故）
      # koffi 的原生模块按平台分包（@koromix/koffi-<os>-<arch>）：electron-app/package.json 的
      # pnpm.supportedArchitectures 让每台 runner 都装齐 mac / win × arm64 / x64，这样 arm64 runner 上
      # 交叉打 x64 dmg 时目标架构那份也在；afterPack（scripts/lib/koffi-native.mjs）再只留目标平台那份、缺了就红。
      - run: pnpm install --frozen-lockfile
        working-directory: electron-app

      # 壳版本号 = tag 版本（electron-updater 按它比对新旧版、必须每次发版递增）
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        shell: bash
        working-directory: electron-app

      # mac 固定签名身份：把自签证书导进「临时钥匙串」，签名在 scripts/electron-after-pack.mjs 里用 codesign --keychain 直接做。
      # v1.9.56 首发时 macOS 26 runner 上 codesign 报「no identity found」（同一个 p12 在本机能签），
      # 所以导入后额外：① 把临时钥匙串加进用户搜索列表；② 把证书标成「代码签名受信任」（admin 域，runner 是一次性虚拟机、
      # 不留痕）；③ 打印诊断并用同一身份签一个探针文件——签不上就在这一步红、日志里直接有原因，不用等到 build 跑完。
      # 为什么要固定身份：ad-hoc 的身份绑代码哈希、每个版本都变，用户在系统里给 Flowship 的「辅助功能」等授权
      # 每次升级都会失效；自签证书的身份是「identifier + 证书」、升级不变，授权保留。
      # fail-closed：缺 secret 就红、不退回 ad-hoc——悄悄发出 ad-hoc 版会让所有用户的授权白白再失效一次。
      # ⚠️ 私钥只在 `release` environment 里（见上面 electron job 的 environment 说明）；
      #    换证书 = 所有用户重新授权一次，同时要改下面的 FLOWSHIP_SIGN_IDENTITY。
      - name: 导入 mac 签名证书（临时钥匙串）
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.FLOWSHIP_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.FLOWSHIP_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::缺 FLOWSHIP_SIGN_P12_BASE64 / FLOWSHIP_SIGN_P12_PASSWORD（应放在 release environment 的 secret 里）、拒绝发出 ad-hoc 版"
            exit 1
          fi
          KC="$RUNNER_TEMP/flowship-sign.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/flowship-sign.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/flowship-sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          rm -f "$RUNNER_TEMP/flowship-sign.p12"
          echo "FLOWSHIP_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

          # ① 加进用户钥匙串搜索列表（保留原有项；路径里没有空格）
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          # ② 证书标成代码签名受信任：自签证书默认 CSSMERR_TP_NOT_TRUSTED。失败只告警（探针才是最终裁判）
          security find-certificate -a -p "$KC" > "$RUNNER_TEMP/flowship-sign.pem"
          if ! sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/flowship-sign.pem"; then
            echo "::warning::add-trusted-cert 失败、证书保持未受信任；以下面的签名探针结果为准"
          fi
          rm -f "$RUNNER_TEMP/flowship-sign.pem"

          # ③ 诊断 + 探针：用 build 同一个身份、同一个钥匙串签一个临时文件，并核对签名身份就是预期证书
          echo "::group::mac 签名身份诊断"
          sw_vers
          security list-keychains -d user
          security find-identity -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" || true
          echo "::endgroup::"
          PROBE="$RUNNER_TEMP/flowship-sign-probe"
          cp /usr/bin/true "$PROBE"
          if ! codesign --force --sign "$FLOWSHIP_SIGN_IDENTITY" --keychain "$KC" "$PROBE"; then
            echo "::error::签名探针失败：codesign 用 $FLOWSHIP_SIGN_IDENTITY 签不上（诊断见上方「mac 签名身份诊断」）"
            exit 1
          fi
          PROBE_REQ="$(codesign -d -r- "$PROBE" 2>&1)"
          rm -f "$PROBE"
          # 与 afterPack、本机 test 包共用同一份判断（scripts/lib/codesign-requirement.mjs）：证书被系统标成受信任时指定要求打印
          # certificate root = H"…"，没被信任（上面 add-trusted-cert 失败）时打印 certificate leaf = H"…"——自签证书链里只有它自己、
          # 两种写法等价、系统里的授权都认，所以都算对。以前这里只认 root、afterPack 认 root|leaf：口径不一，
          # add-trusted-cert 失败时探针先红、而 afterPack 本来是放行的（第三轮评审）
          if ! printf '%s' "$PROBE_REQ" | node --input-type=module -e '
            import { designatedRequirementNamesCertificate } from "./scripts/lib/codesign-requirement.mjs";
            let out = "";
            for await (const chunk of process.stdin) out += chunk;
            process.exit(designatedRequirementNamesCertificate(out, process.env.FLOWSHIP_SIGN_IDENTITY) ? 0 : 1);
          '; then
            echo "::error::探针的签名身份不是预期证书 $FLOWSHIP_SIGN_IDENTITY：$PROBE_REQ"
            exit 1
          fi
          echo "签名探针通过：$FLOWSHIP_SIGN_IDENTITY"

      # 压缩策略统一走 electron-builder.yml 的 compression: maximum（V0.11.4）——
      # 旧「win 降级到 level 3 提安装速度」特例已回收：实测对体积/安装速度都无变化
      # （LZMA 解压速度和压缩级别基本无关）、拉满后 exe 213MB→112MB
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder 自己不签名（identity: null）、也关掉证书自动发现防 CI 报错；
          # mac 签名由 scripts/electron-after-pack.mjs 用下面三个变量完成（win 不读它们）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 签名身份指纹 FLOWSHIP_SIGN_IDENTITY 在 job 级 env 里（afterPack 签完会核对产物的签名身份就是它，不对就红）
          # 发版必须固定身份：没配 FLOWSHIP_SIGN_IDENTITY 就直接失败、不退回 ad-hoc
          FLOWSHIP_REQUIRE_STABLE_SIGN: "1"

      # 临时钥匙串用完就删（runner 本来是一次性的，多一道保险）
      - name: 清理 mac 签名钥匙串
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${FLOWSHIP_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$FLOWSHIP_SIGN_KEYCHAIN" || true
          fi

  # 所有平台包（exe / 两枚 mac dmg / latest.yml / latest-mac.yml）都传完后：
  # 1) 汇总两枚 mac dmg + 一枚 Windows exe 生成签名 update-manifest（必须在转正前、壳按 asset 名找条目）
  # 2) 把 draft release 转正 published
  # needs electron = win + 两枚 mac 都成功才进 finalize：任一 matrix 挂 → needs 不满足、
  # 留 draft 不对外（fail-fast:false 只让兄弟 job 继续跑、不让残缺版变 published）。
  # 转正后 /releases/latest 才指向它、mac fetchLatestVersion / win electron-updater 这才查得到、
  # 且此刻 asset + manifest 已齐全——根治 v0.8.0「asset 没传完就被自更新下到残缺」的事故。
  #
  # environment: release —— 签名私钥（UPDATE_MANIFEST_PRIVATE_KEY）只有这个 job 用。
  # 仓库设置里（一次性、需要仓库管理员）：Settings → Environments → release → 勾 Required reviewers，
  # 并把 UPDATE_MANIFEST_PRIVATE_KEY 从仓库级 secret 挪成 environment 级 secret，签名就需要审批人点同意才会放行；
  # 没配置时 GitHub 会按名字自动建一个无保护的 environment，行为与以前一致、不会卡发版。
  finalize:
    needs: electron
    runs-on: ubuntu-latest
    environment: release
    steps:
      # 要用 scripts/generate-update-manifest.mjs（纯 node:crypto、不必 pnpm install）
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 先下载两枚 mac dmg + 一枚 Windows exe → 一次签进同一 manifest.files[] → 再 upload。
      # mac dmg 与 Windows exe 都没有代码签名 / Apple 签名（exe 无代码签名证书），安装包真实性
      # 只能靠这份 Ed25519 签名清单自证：壳在 mac 暂存前 / Windows 下载完成后与 quitAndInstall 前都验签（R9-01）。
      # 不能放回 matrix job：各 job 会各自生成只含自己 asset 的 manifest、后跑的
      # --clobber 覆盖先跑的、壳 verifyDownloadedUpdate 按文件名找条目会缺平台 / 架构。
      # 顺序必须在转正之前：published 后 /releases/latest 可见、manifest 必须已齐全。
      # fail-closed：无私钥 / 签名失败 / 验签不过 / 文件缺失 → 整 job 红、draft 不转正
      - name: 生成并上传 update-manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p assets
          # exe 的 glob 以 .exe 结尾收口：release 上同名的 .exe.blockmap 不会被匹配进来
          gh release download "$GITHUB_REF_NAME" \
            --pattern "fe-ai-flow-*-mac-*.dmg" \
            --pattern "fe-ai-flow-*-win-*.exe" \
            --dir assets
          echo "已下载的待签名安装包："
          ls -la assets/
          # 必须恰好 2 枚 dmg（arm64 + x64）+ 恰好 1 枚 exe——少任何一枚就签出残缺 manifest、
          # 对应平台 / 架构的壳验签必挂（新壳对缺条目一律拒绝自动安装）；多出来的更是误签。
          # （理论不会进 finalize、needs 会拦；保险硬退出、宁可红也不发残缺版）
          shopt -s nullglob
          DMGS=(assets/*.dmg)
          EXES=(assets/*.exe)
          if [ ${#DMGS[@]} -ne 2 ]; then
            echo "::error::mac dmg 应为 2 枚（arm64+x64）、实际 ${#DMGS[@]} 枚、拒绝生成残缺 update-manifest / 转正"
            exit 1
          fi
          if [ ${#EXES[@]} -ne 1 ]; then
            echo "::error::Windows exe 应为 1 枚、实际 ${#EXES[@]} 枚、拒绝生成残缺 update-manifest / 转正"
            exit 1
          fi
          # 私钥缺失时脚本 exit 1（不再 warn 跳过）
          node scripts/generate-update-manifest.mjs "$VERSION" "${DMGS[@]}" "${EXES[@]}"
          if [ ! -f update-manifest.json ]; then
            echo "::error::update-manifest.json 未生成、拒绝上传 / 转正"
            exit 1
          fi
          # 用壳内置公钥（electron-app/update-manifest-public-key.pem）自检验签——
          # 私钥/公钥不匹配会在转正前拦下，避免发出「壳永远装不上」的 release；
          # 同时校验条目覆盖面（2 dmg + 1 exe、文件名带本次版本号）
          node scripts/verify-update-manifest.mjs update-manifest.json
          gh release upload "$GITHUB_REF_NAME" update-manifest.json --clobber
        shell: bash
        env:
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # manifest 传完才转正——维持「asset 齐全才对外可见」
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const draft = releases.find((r) => r.tag_name === tag && r.draft);
            if (!draft) {
              // 不能静默成功：manifest 已签 / 已上传、却没有 draft 可转正，说明 release 被人手动转正或删除过——
              // 流水线绿着但实际没发出东西 / 发出的不是这次产物，必须红出来让人看
              core.setFailed(`没找到 tag=${tag} 的 draft release、拒绝静默跳过（是否被手动转正 / 删除过？）`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: draft.id,
              draft: false,
            });
            core.info(`已发布 release ${tag}`);
